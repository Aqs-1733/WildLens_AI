[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "frontend*", "data*", "models*", "storage*", "scripts*", "ml*", "tools*"]

[project]
name = "wildlens-ai"
version = "2.0.0"
description = "识境 - cross-platform animal, plant, natural phenomenon and behavior recognition science app"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.41",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2.0",
  "pyjwt>=2.10.1",
  "argon2-cffi>=25.1.0",
  "httpx>=0.28.1",
  "numpy>=2.2.0",
  "opencv-python-headless>=4.11.0.86,<5",
  "onnxruntime>=1.22.0",
  "pillow>=11.2.0",
  "langgraph>=0.6.0",
  "langchain-core>=0.3.68",
  "langchain-openai>=0.3.27",
  "reportlab>=4.4.0",
]

[project.optional-dependencies]
vision = [
  "onnxruntime>=1.22.0",
  "ultralytics>=8.3.160",
]
bioclip = [
  "torch>=2.7.0",
  "open-clip-torch>=3.2.0",
  "pillow>=11.2.0",
]
training = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "scikit-learn>=1.7.0",
  "psutil>=7.0.0",
  "onnx>=1.18.0",
  "onnxscript>=0.3.0",
]
postgres = ["psycopg[binary]>=3.2.9"]
redis = ["redis>=6.2.0"]
desktop-tools = ["pyqt6>=6.9.0"]
rag = ["chromadb>=1.0.15", "sentence-transformers>=5.0.0"]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
